[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmarket"
version = "0.1.0"
description = "Job listing collection, enrichment, filtering, and export tools"
readme = "CHANGELOG.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "python-jobspy==1.1.82",
    "pandas==2.3.3",
    "playwright==1.62.0",
    "playwright-stealth==2.0.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "requests[socks]==2.34.2",
    "streamlit==1.62.0",
    "plotly==7.0.0",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov>=6,<8"]
dev = [
    "pytest==8.4.2",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "pre-commit>=4,<5",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[tool.setuptools]
packages = ["jobmarket", "jobmarket.resume"]
include-package-data = true

[tool.setuptools.package-data]
jobmarket = ["skill_catalog.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["jobmarket", "tests"]
include = ["jobmarket/**/*.py", "tests/**/*.py", "app.py", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["jobmarket"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["jobmarket"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
